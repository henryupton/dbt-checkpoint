name: Increment Version

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Type of version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main

jobs:
  increment-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get-tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Calculate new version
        id: new-version
        run: |
          LATEST_TAG="${{ steps.get-tag.outputs.latest_tag }}"
          VERSION_BUMP="${{ inputs.version_bump || 'patch' }}"

          VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          case $VERSION_BUMP in
            "major")
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            "minor")
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            "patch")
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      # Tags keep the v prefix that pre-commit `rev:` pins use; setup.cfg holds the bare version.
      - name: Update setup.cfg
        run: |
          sed -i "s/^version = .*/version = ${{ steps.new-version.outputs.new_version }}/" setup.cfg

      - name: Create and push new tag
        run: |
          NEW_TAG="v${{ steps.new-version.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add setup.cfg
          git diff --cached --quiet || git commit -m "Bump version to ${NEW_TAG#v}"

          git tag "$NEW_TAG"
          git push origin main
          git push origin "$NEW_TAG"

          echo "Created and pushed tag: $NEW_TAG"

      - name: Create GitHub Release
        run: |
          NEW_TAG="v${{ steps.new-version.outputs.new_version }}"
          LATEST_TAG="${{ steps.get-tag.outputs.latest_tag }}"

          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --notes "## What's Changed

          Automated release with version increment.

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$LATEST_TAG...$NEW_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pins gh to this repo, never the fork's upstream parent.
          GH_REPO: ${{ github.repository }}
